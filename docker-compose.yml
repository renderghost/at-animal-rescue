# Local development services. Production deployment is tracked in #47.
name: homeward

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: homeward
      POSTGRES_PASSWORD: homeward
      POSTGRES_DB: homeward
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP check: during first-run init Postgres only listens on the Unix socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U homeward -d homeward']
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI: http://localhost:8025

volumes:
  postgres-data:
