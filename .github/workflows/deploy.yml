name: Images and deploy

# Production images (#47): built on pull requests that touch them (to check they build),
# and on main after CI passes, when they're pushed to GHCR and deployed to the server.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
      - 'apps/web/Dockerfile'
      - 'apps/web/next.config.ts'
      - 'apps/indexer/Dockerfile'
      - 'apps/indexer/docker-entrypoint.sh'
      - 'deploy/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: indexer
            dockerfile: apps/indexer/Dockerfile
          - image: backup
            dockerfile: deploy/backup/Dockerfile
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/homeward-${{ matrix.image }}:sha-${{ env.SHA }}
            ghcr.io/${{ github.repository_owner }}/homeward-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Automatic deploy on merge (agreed in #47). Waits until the server exists: set the
  # repository variable DEPLOY_ENABLED to "true" once docs/DEPLOY.md is done.
  deploy:
    needs: images
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: SSH access
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy the stack definition
        run: scp deploy/compose.production.yml deploy/Caddyfile "$TARGET:/opt/homeward/"
      - name: Pull, migrate and restart
        # The settings check and migrations run first; if either fails, the running version
        # stays up.
        run: |
          ssh "$TARGET" "cd /opt/homeward && export IMAGE_TAG=sha-$SHA &&
            docker compose -f compose.production.yml pull --quiet &&
            docker compose -f compose.production.yml up -d --remove-orphans &&
            docker image prune -f"
      - name: Check the site answers
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null "https://${{ vars.DEPLOY_DOMAIN }}/api/health" && exit 0
            sleep 10
          done
          echo "::error::https://${{ vars.DEPLOY_DOMAIN }}/api/health wasn't healthy after the deploy"
          exit 1
