# Production stack (#47, #48) on one EU server: Caddy (TLS), the web app, the indexer,
# Postgres/PostGIS, nightly encrypted backups and Bugsink for errors. Runs from /opt/homeward,
# next to a .env made from production.env.example, which both configures the containers and
# fills in the ${...} values below (see docs/DEPLOY.md). On your own computer, use the
# docker-compose.yml at the repository root instead (docs/LOCAL.md).
name: homeward

x-env: &env
  DATABASE_URL: postgres://homeward:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/homeward
  # Scaleway Transactional Email (#48): SMTP over TLS, signed in with the project's API key.
  SMTP_URL: smtps://${TEM_PROJECT_ID:-}:${TEM_SECRET_KEY:-}@smtp.tem.scaleway.com:465
  # Error reports name the release they came from.
  IMAGE_TAG: ${IMAGE_TAG:-latest}

x-app: &app
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ERRORS_DOMAIN: ${ERRORS_DOMAIN:?set ERRORS_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - bugsink

  web:
    <<: *app
    image: ghcr.io/renderghost/homeward-web:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      SENTRY_DSN: ${SENTRY_DSN_WEB:-}
      # /api/health reports the indexer too, for the uptime monitor.
      INDEXER_HEALTH_URL: http://indexer:8081/health
    volumes:
      # Public photos, resized; can always be rebuilt from the PDS (#26).
      - image-cache:/data/images
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  indexer:
    <<: *app
    image: ghcr.io/renderghost/homeward-indexer:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      SENTRY_DSN: ${SENTRY_DSN_INDEXER:-}
    healthcheck:
      # 200 while connected to Jetstream.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Checks .env first (#102): a mistake stops the deploy here, before anything changes, and
  # the running version stays up. Run it yourself after editing .env: `run --rm check`.
  check:
    image: ghcr.io/renderghost/homeward-indexer:${IMAGE_TAG:-latest}
    command: check
    env_file: .env
    restart: 'no'

  # Runs once per deploy, after the check and before the app starts.
  migrate:
    image: ghcr.io/renderghost/homeward-indexer:${IMAGE_TAG:-latest}
    command: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgres://homeward:${POSTGRES_PASSWORD}@postgres:5432/homeward
    depends_on:
      check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: 'no'

  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: homeward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: homeward
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U homeward -d homeward']
      interval: 5s
      timeout: 5s
      retries: 30
    # Not published: only the containers on this network reach it.

  backup:
    image: ghcr.io/renderghost/homeward-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: homeward
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: homeward
    depends_on:
      postgres:
        condition: service_healthy

  # Error tracking (#48): Sentry-compatible and self-hosted, so error reports, which can hold
  # personal data, never leave this server. Kept for 90 days.
  bugsink:
    image: bugsink/bugsink:2.6.2
    restart: unless-stopped
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY:?set BUGSINK_SECRET_KEY in .env}
      BASE_URL: https://${ERRORS_DOMAIN}
      BEHIND_HTTPS_PROXY: 'true'
      SINGLE_TEAM: 'true'
      MAX_EVENT_AGE_DAYS: 90
      # Alerts by email, through Scaleway Transactional Email.
      EMAIL_HOST: smtp.tem.scaleway.com
      EMAIL_PORT: 465
      EMAIL_USE_SSL: 'true'
      EMAIL_HOST_USER: ${TEM_PROJECT_ID:-}
      EMAIL_HOST_PASSWORD: ${TEM_SECRET_KEY:-}
      DEFAULT_FROM_EMAIL: ${EMAIL_FROM:-}
    volumes:
      - bugsink-data:/data

  # Cookie-free analytics (#46), only with `--profile analytics`; its own database on the
  # same server (create it once, see docs/DEPLOY.md).
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.19.0
    profiles: [analytics]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://homeward:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: 1
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bugsink-data:
  caddy-data:
  caddy-config:
  image-cache:
  postgres-data:
